

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-DevDiary</title>

    <style>
        body{
            background: #101010;
            color: #eee;
            font-family: cursive;
            line-height: 1.6;
            margin: 0;
        }

        header{
            background: #10101010;
            border-bottom: 1px solid #3333;
        }

        nav{
            max-width: 10000px;
            margin: auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1{
            font-family: cursive;
            font-size: 28px;
        }

        .menu a{
            color: #bbbbbb;
            text-decoration: none;
            margin-left: 25px;
        }

        .menu a:hover{
            color: rgb(0, 0, 0);
            background-color: rgb(15, 209, 86);
        }

        main{
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        .top{
            text-align: center;
            padding: 10px 20px;
        }

        .small{
            color: #888;
            font-size: 12px;
            margin: 10px 0;
        }

        .login-box{
            max-width: 400px;
            margin: 30px auto;
            background: #181818;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 30px;
        }

        .login-box h2{
            font-family: cursive;
            font-size: 28px;
            margin: 8px 0;
        }

        .login-box p{
            color: #999;
        }

        label{
            display: block;
            color: #aaa;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input{
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #101010;
            color: #eee;
            border: 1px solid #444;
            border-radius: 5px;
            font-family: cursive;
        }

        input:focus{
            outline: none;
            border-color: #0fd156;
        }

        .button{
            display: inline-block;
            background: #eee;
            color: #111;
            padding: 9px 16px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 20px;
            border: none;
            font-family: cursive;
            cursor: pointer;
        }

        .button:hover{
            background: #bbb;
        }

        .signup{
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .signup a{
            color: #0fd156;
            text-decoration: none;
        }

        footer{
            margin-top: 50px;
            padding: 30px;
            text-align: center;
            background: #151515;
            border-top: 1px solid #333;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <h1>Dev Diary</h1>

            <div class="menu">
                <a href="index.html">Home</a>
                <a href="blog.html">Blog</a>
                <a href="about.html">About</a>
                <a href="login.html">Login</a>
            </div>
        </nav>
    </header>


    <main>

        <section class="top">
            <p class="small">Login</p>
            <h2>Welcome Back!</h2>
            <p>Login to your Dev Diary account.</p>
        </section>


        <section class="login-box">

            <h2>Login</h2>
            <p>Enter your details to continue.</p>

            <form>

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="button">
                    Login
                </button>

            </form>

            <p class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </p>

        </section>

    </main>


    <footer>
        <p>Made by Himanshu ( Newton in Slack & Nepzilla in Discord)</p>
    </footer>

</body>
</html>
